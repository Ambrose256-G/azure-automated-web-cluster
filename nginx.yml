---
- name: Configure Web Servers behind Load Balancer
  hosts: role_web
  become: true
  gather_facts: true
  tasks:

    - name: Wait for automatic system updates to release the apt lock
      ansible.builtin.apt:
        update_cache: true
      register: apt_status
      until: apt_status is success
      retries: 30
      delay: 10

    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true


    - name: Create index HTML showcasing Load Balancer routing
      ansible.builtin.copy:
        content: "Hello from Bicep + Ansible Backend VM: {{ ansible_hostname }}\n"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Ensure Nginx is running and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true
